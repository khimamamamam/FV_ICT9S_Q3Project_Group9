<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Train - MetroFare PH</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

/* ================= YOUR SAME THEME ================= */

body {
    margin: 0;
    height: 100vh;
    font-family: 'Orbitron', sans-serif;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;

    background-size: cover;
    background-position: center;
    animation: slide 12s ease-in-out infinite;

    filter: blur(6px) brightness(1);
    transform: scale(1.1) rotate(-2deg);
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(10, 25, 50, 0.5);
    z-index: -1;
}

@keyframes slide {

    0% {
        background-image: url("https://i.pinimg.com/1200x/d3/87/a2/d387a25cfcadea95e4ce5c78ac682119.jpg");
        filter: blur(6px) brightness(1);
        transform: scale(1.1) rotate(-2deg);
    }

    40% {
        background-image: url("https://i.pinimg.com/1200x/07/d8/0e/07d80e23bb62a11c678493c484b6d148.jpg");
        filter: blur(8px) brightness(1.3);
        transform: scale(1.2) rotate(3deg);
    }

    80% {
        background-image: url("https://i.pinimg.com/1200x/97/4d/cf/974dcf4589bd4648d8cca04be51cc78d.jpg");
        filter: blur(7px) brightness(1.2);
        transform: scale(1.15) rotate(-3deg);
    }

    100% {
        background-image: url("https://i.pinimg.com/1200x/c8/a8/ed/c8a8ed8b3f0ab970a8db5f2f56b6c9e1.jpg");
        filter: blur(6px) brightness(1);
        transform: scale(1.1) rotate(0deg);
    }
}

.navbar {
    background: rgba(20, 40, 70, 0.6);
    backdrop-filter: blur(12px);
    padding: 12px 24px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);

    box-shadow:
        0 0 8px rgba(30, 146, 255, 0.4),
        0 0 20px rgba(30, 109, 255, 0.5);
}

.nav-logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 20px;
    transition: 0.3s ease;
}

.nav-logo:hover {
    transform: scale(1.1);

    box-shadow:
        0 0 10px rgba(30,139,255,0.9),
        0 0 25px rgba(30,139,255,0.7);
}

.nav-left {
    display: flex;
    align-items: center;
}

.nav-left a {
    margin-right: 18px;
    text-decoration: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    transition: 0.3s ease;
}

.nav-left a:hover {
    background: rgba(30,206,255,0.2);
    transform: scale(1.08);

    border: 1px solid #1ea5ff;

    box-shadow:
        0 0 8px rgba(30, 146, 255, 0.6),
        0 0 20px rgba(30, 109, 255, 0.8);
}

.nav-center {
    justify-self: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    color: white;
    text-shadow:
        0 0 8px rgba(30,116,255,0.6),
        0 0 18px rgba(30,113,255,0.8);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-self: end;
}

.nav-right a {
    color: white;
    text-decoration: none;
    transition: 0.3s ease;
}

.footer {
    background: linear-gradient(
        to top,
        rgba(20, 40, 70, 0.95),
        rgba(20, 40, 70, 0.75)
    );
    backdrop-filter: blur(15px);
    padding: 15px 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.2);
    box-shadow:
        0 -5px 15px rgba(30, 128, 255, 0.6),
        0 -10px 30px rgba(30, 146, 255, 0.4);
    color: white;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 1px;
    text-shadow:
        0 0 8px rgba(30,116,255,0.6),
        0 0 18px rgba(30,113,255,0.8);
}

.book-now:hover {
    text-shadow:
        0 0 8px rgba(30,139,255,0.9),
        0 0 15px rgba(30,139,255,0.8);
}

.nav-right .create-navbar {
    padding: 8px 14px;
    background: linear-gradient(135deg, #71b5f4, #64c6ff);
    color: white;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s ease;
}

.nav-right .create-navbar:hover {
    transform: scale(1.08);

    box-shadow:
        0 0 10px rgba(30,139,255,0.9),
        0 0 25px rgba(30,139,255,0.7);
}

.booking-container {
    width: 800px;
    max-width:95%;
    margin:120px auto;
    padding:30px;
    background: rgba(20,40,70,0.4);
    backdrop-filter: blur(20px);
    border-radius:15px;
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 0 20px rgba(30,128,255,0.8);
}

.book-btn {
    width:100%;
    padding:12px;
    background:#71b5f4;
    border:none;
    border-radius:8px;
    font-weight:bold;
    transition:0.3s ease;
    color:#0f3f75;
}

.book-btn:hover {
    transform:scale(1.03);
    box-shadow:
        0 0 10px #488db5,
        0 0 30px rgba(19,95,167,0.7);
}

select {
    width:100%;
    padding:10px;
    border-radius:6px;
    border:none;
    font-family:'Orbitron',sans-serif;
    transition:0.3s;
}

select:focus {
    outline:none;
    box-shadow:0 0 10px #64c6ff;
}

select:hover,
select:focus {
    outline: none;
    border: 1px solid #6498ff;
    box-shadow:
        0 0 10px #6495ff,
        0 0 20px rgba(100, 154, 255, 0.8),
        0 0 40px rgba(100, 157, 255, 0.6);
    transition: all 0.3s ease;
}

.booking-title {
    text-align: center;
    margin-bottom: 25px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    color: white;
    text-shadow:
        0 0 8px rgba(30,116,255,0.6),
        0 0 18px rgba(30,113,255,0.8),
        0 0 28px rgba(30,128,255,0.6);
}

.booking-container label {
    color: white;
    font-weight: 600;
    letter-spacing: 1px;
}

.booking-note {
    margin-top: 25px;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.12);
    border-left: 5px solid #70a6d8;
    border-radius: 10px;
    font-size: 18px;
    color: white;
    text-align: left;
    box-shadow: 0 0 12px rgba(30, 128, 255, 0.5);
    line-height: 1.6;
}

.booking-note span {
    font-weight: bold;
    color: #64aaff;
    text-shadow: 0 0 8px #64a7ff;
}

</style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
    
            <img src="MetroFarePH.jpeg" class="nav-logo">
    
            <a href="home.html">Home</a>
            <a href="farematrix.html">Fare Matrix</a>
            <a href="schedule.html">Schedule</a>
        </div>
    
        <div class="nav-center">
            MetroFare PH
        </div>
    
        <div class="nav-right">
            <a href="booknow.html" class="book-now">Book Now</a>
            <a href="registration.html" class="create-navbar">Create Account</a>
        </div>
    </div>

<div class="booking-container text-center">

    <h2 class="booking-title">
        🚆 Book Your Train Ticket
        </h2>

<label>From:</label>
<select id="fromStation">
<option value="" disabled selected>Select Current Station</option>
<option>Santolan</option>
<option>Katipunan</option>
<option>Anonas</option>
<option>Cubao</option>
<option>Betty Go</option>
<option>Gilmore</option>
<option>J Ruiz</option>
<option>V Mapa</option>
<option>Pureza</option>
<option>Legarda</option>
<option>Recto</option>
</select>

<br><br>

<label>To:</label>
<select id="toStation">
<option value="" disabled selected>Select Destination</option>
<option>Santolan</option>
<option>Katipunan</option>
<option>Anonas</option>
<option>Cubao</option>
<option>Betty Go</option>
<option>Gilmore</option>
<option>J Ruiz</option>
<option>V Mapa</option>
<option>Pureza</option>
<option>Legarda</option>
<option>Recto</option>
</select>

<br><br>

<label>Passenger Type:</label>
<select id="passengerType">
<option value="regular">Regular</option>
<option value="student">Student / Senior / PWD (20% Off)</option>
</select>

<br>

<div class="booking-note">
    <strong>NOTE:</strong>
    Please check the <span>Fare Matrix</span> first to view the estimated price before confirming your booking.
</div>

<br><br>

<button class="book-btn" onclick="bookTicket()">
Confirm Booking
</button>

</div>



<div class="footer">
    <p>Kirsten Heart D. Imam & Gabrielle Antoinette De Jesus | 9 - Sapphire 2026</p>
    </div>

    <script>

        function bookTicket() {
        
        let from = document.getElementById("fromStation").value;
        let to = document.getElementById("toStation").value;
        let type = document.getElementById("passengerType").value;
        
        if(!from || !to){
        alert("Please select both stations!");
        return;
        }
        
        if(from === to){
        alert("❌ You cannot select the same station for Pickup and Dropoff!");
        return;
        }
         
        window.location.href = "confirmation.html";
        
        }
        
        </script>

</script>

</body>
</html>
