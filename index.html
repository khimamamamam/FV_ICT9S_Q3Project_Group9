<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700" rel="stylesheet">
</head>

<style>
body {
    margin: 0;
    height: 100vh;

    justify-content: center;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    background-size: cover;
    background-position: center;
    animation: slide 8s 2s infinite;
}

@keyframes slide {
    0% {
        background-image: url("https://i.pinimg.com/1200x/d3/87/a2/d387a25cfcadea95e4ce5c78ac682119.jpg");
    }
    25% {
        background-image: url("https://i.pinimg.com/1200x/07/d8/0e/07d80e23bb62a11c678493c484b6d148.jpg");
    }
    50% {
        background-image: url("https://i.pinimg.com/736x/97/4d/cf/974dcf4589bd4648d8cca04be51cc78d.jpg");
    }
    75% {
        background-image: url("https://i.pinimg.com/736x/78/ff/6f/78ff6fc3e981ad32fdd0be1746ce562a.jpg");
    }
    100% {
        background-image: url("https://i.pinimg.com/1200x/c8/a8/ed/c8a8ed8b3f0ab970a8db5f2f56b6c9e1.jpg");
    }
}

.navbar {
    background: linear-gradient(
        to bottom,
        rgba(20, 40, 70, 0.95),
        rgba(20, 40, 70, 0.75)
    );
    backdrop-filter: blur(15px);
    padding: 12px 24px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;

    box-shadow:
        0 10px 35px rgba(88, 140, 255, 0.35),
        0 5px 20px rgba(88, 140, 255, 0.2);

    position: relative;
    z-index: 10;
}

.navbar::after {
    content: "";
    position: absolute;
    bottom: -40px;
    left: 0;
    width: 100%;
    height: 60px;

    background: linear-gradient(
        to bottom,
        rgba(20,40,70,0.7),
        rgba(0,0,0,0)
    );

    filter: blur(20px);
    pointer-events: none;
}

.nav-left a {
    margin-right: 18px;
    text-decoration: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    transition: 0.3s;
}

.nav-left a:hover {
    background: rgba(30,206,255,0.25);
    transform: scale(1.08);
    border: 1px solid #1ea5ff;
    box-shadow:
        0 0 8px rgba(30,146,255,0.6),
        0 0 20px rgba(30,109,255,0.8);
}

.nav-center {
    color: rgb(246, 250, 252);
    justify-self: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow:
        0 0 8px rgba(30,116,255,0.6),
        0 0 18px rgba(30,113,255,0.8),
        0 0 30px rgba(30,128,255,0.5);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-self: end;
}

.nav-right a {
    color: white;
    text-decoration: none;
}

.nav-right .create-navbar {
    padding: 8px 14px;
    background: linear-gradient(135deg, #71b5f4, #64c6ff);
    color: white;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.nav-right .create-navbar:hover {
    transform: scale(1.08);
    box-shadow:
        0 0 8px #64c6ff,
        0 0 16px #5eace8,
        0 0 25px rgba(30,139,255,0.9);
}
</style>

<body>
    
</body>
<div class="navbar">
    <div class="nav-left">
        <a href="#home.html">Home</a>
        <a href="#farematrix.html">Fare Matrix</a>
        <a href="#schedule.html">Schedule</a>
    </div>

    <div class="nav-center">
        ESakay Fare Guide
    </div>

    <div class="nav-right">
        <a href="#">Book Now</a>
        <button class="create-navbar">Create Account</button>
    </div>
</div>

</html>
