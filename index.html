<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q3 Project</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>

/* ========================= */
/*         BACKGROUND        */
/* ========================= */

body {
    margin: 0;
    height: 100vh;
    font-family: 'Orbitron', sans-serif;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;

    background-size: cover;
    background-position: center;
    animation: slide 12s ease-in-out infinite;

    filter: blur(6px) brightness(1);
    transform: scale(1.1) rotate(-2deg);
}

/* ========================= */
/*      WARP ANIMATION       */
/* ========================= */

@keyframes slide {

    0% {
        background-image: url("https://i.pinimg.com/1200x/d3/87/a2/d387a25cfcadea95e4ce5c78ac682119.jpg");
        filter: blur(6px) brightness(1);
        transform: scale(1.1) rotate(-2deg);
    }

    40% {
        background-image: url("https://i.pinimg.com/1200x/07/d8/0e/07d80e23bb62a11c678493c484b6d148.jpg");
        filter: blur(8px) brightness(1.3);
        transform: scale(1.2) rotate(3deg);
    }

    80% {
        background-image: url("https://i.pinimg.com/1200x/97/4d/cf/974dcf4589bd4648d8cca04be51cc78d.jpg");
        filter: blur(7px) brightness(1.2);
        transform: scale(1.15) rotate(-3deg);
    }

    100% {
        background-image: url("https://i.pinimg.com/1200x/c8/a8/ed/c8a8ed8b3f0ab970a8db5f2f56b6c9e1.jpg");
        filter: blur(6px) brightness(1);
        transform: scale(1.1) rotate(0deg);
    }
}

/* ========================= */
/*        GLOW NAVBAR        */
/* ========================= */

.navbar {
    background: rgba(20, 40, 70, 0.6);
    backdrop-filter: blur(12px);
    padding: 12px 24px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);

    box-shadow:
        0 0 8px rgba(30, 146, 255, 0.4),
        0 0 20px rgba(30, 109, 255, 0.5);
}

/* ========================= */
/*         NAV LOGO          */
/* ========================= */

.nav-logo {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 20px;
    transition: 0.3s ease;
}

.nav-logo:hover {
    transform: scale(1.1);

    box-shadow:
        0 0 10px rgba(30,139,255,0.9),
        0 0 25px rgba(30,139,255,0.7);
}

/* ========================= */
/*        NAV LINKS          */
/* ========================= */

.nav-left {
    display: flex;
    align-items: center;
}

.nav-left a {
    margin-right: 18px;
    text-decoration: none;
    color: white;
    padding: 6px 12px;
    border-radius: 6px;
    transition: 0.3s ease;
}

.nav-left a:hover {
    background: rgba(30,206,255,0.2);
    transform: scale(1.08);

    border: 1px solid #1ea5ff;

    box-shadow:
        0 0 8px rgba(30, 146, 255, 0.6),
        0 0 20px rgba(30, 109, 255, 0.8);
}

/* ========================= */
/*       NAV CENTER TEXT     */
/* ========================= */

.nav-center {
    justify-self: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
    color: white;
    text-shadow:
        0 0 8px rgba(30,116,255,0.6),
        0 0 18px rgba(30,113,255,0.8);
}

/* ========================= */
/*        NAV BUTTON         */
/* ========================= */

.nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-self: end;
}

.nav-right a {
    color: white;
    text-decoration: none;
}

.nav-right .create-navbar {
    padding: 8px 14px;
    background: linear-gradient(135deg, #6683d9, #aedcf8);
    color: white;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s ease;
}

.nav-right .create-navbar:hover {
    transform: scale(1.08);

    box-shadow:
        0 0 10px rgba(30,139,255,0.9),
        0 0 25px rgba(30,139,255,0.7);
}

</style>
</head>

<body>

<div class="navbar">
    <div class="nav-left">

        <!-- ✅ LOGO ADDED HERE -->
        <img src="MetroFarePH.jpeg" class="nav-logo">

        <a href="#home.html">Home</a>
        <a href="#farematrix.html">Fare Matrix</a>
        <a href="#schedule.html">Schedule</a>
    </div>

    <div class="nav-center">
        MetroFare PH
    </div>

    <div class="nav-right">
        <a href="#">Book Now</a>
        <button class="create-navbar">Create Account</button>
    </div>
</div>

</body>
</html>
